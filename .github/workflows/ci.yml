# Continuous integration: runs on every push to main and on every pull request.
# Integración continua: corre en cada push a main y en cada pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
# Mínimo privilegio: el workflow solo lee el repositorio.
permissions:
  contents: read

# A newer run on the same branch cancels the older one.
# Una corrida más nueva en la misma rama cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies / Instalar dependencias
        run: npm ci

      - name: Typecheck / Verificar tipos
        run: npm run typecheck

      - name: Lint / Análisis estático
        run: npm run lint

      # Tests run in a non-UTC timezone on purpose: code that silently depends on
      # the machine's local time fails here instead of in production.
      # Los tests corren en una zona horaria distinta de UTC a propósito: el código
      # que dependa en silencio de la hora local falla acá y no en producción.
      - name: Unit tests / Pruebas unitarias
        run: npm test
        env:
          TZ: America/Argentina/Buenos_Aires

      - name: Build / Compilar
        run: npm run build

  # Runs every SQL migration and test against a throwaway PostgreSQL 17 (same major version as Supabase).
  # The password below belongs to a temporary container that only lives during this job: it is not a secret.
  # Corre cada migración y prueba SQL contra un PostgreSQL 17 descartable (misma versión mayor que Supabase).
  # La contraseña de abajo es de un contenedor temporal que solo vive durante este job: no es un secreto.
  database:
    name: SQL migrations and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-throwaway
    steps:
      - uses: actions/checkout@v6

      - name: Run migrations and SQL tests / Correr migraciones y pruebas SQL
        run: bash scripts/db/ci-sql-tests.sh
